id: weather
name: Weather
version: 3
description: Responsive weather widget for OpenDisplay Studio, inspired by the TRMNL Weather layout
framework: 3.2.0
template: widget.liquid

defaults:
  weather: ""
  showHumidity: true
  showFeelsLike: true
  showForecast: true

fields:
  - key: weather
    label: Weather entity
    required: true
    selector:
      entity:
        filter:
          domain: weather
  - key: showHumidity
    label: Show humidity
    selector:
      boolean: {}
  - key: showFeelsLike
    label: Show feels like
    selector:
      boolean: {}
  - key: showForecast
    label: Show forecast
    selector:
      boolean: {}

dataRequirements:
  - key: weather
    provider: weather_forecast
    configKey: weather
    cardinality: one
    optional: false
    forecastType: daily
